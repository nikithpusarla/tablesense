# TableSense configuration — every tunable lives here; no code changes needed.

restaurant:
  name: "Spice Garden"
  currency: "₹"

# simulation = no camera / no AI model needed (great for demos)
# live       = real CCTV / video file / webcam with YOLO11n + ByteTrack
mode: simulation

# Live-mode video source: file path, RTSP URL, or webcam index (0)
source: "videos/demo.mp4"

server:
  host: "0.0.0.0"
  port: 8000

simulation:
  speed: 5                 # initial speed multiplier (1, 5, 20 selectable on dashboard)
  start_time: "19:00"      # sim clock when the dashboard opens (HH:MM today) or "now"
  warmup_min: 60           # pre-run this many sim minutes at startup so tables are already busy
  seed: 42                 # random seed (null = different every run)
  noise:
    miss_prob: 0.04        # chance a seated guest is missed by the "detector" in a tick
    ghost_prob: 0.005      # chance of a false guest detection at an empty table
  waiter_response_min: [1, 3]        # minutes, normal waiter response
  waiter_response_slow_min: [3.2, 6] # minutes, slow response (triggers waiter alerts)
  slow_waiter_prob: 0.15             # chance a response is slow
  dining_min: [35, 75]               # minutes
  cleaning_delay_min: [1, 2]         # minutes after guests leave, normal
  cleaning_delay_slow_min: [2, 6]    # minutes, slow cleaning (triggers cleaning alerts)
  slow_cleaning_prob: 0.3
  num_waiters: 5

engine:
  seat_confirm_sec: 8       # guests continuously present → SEATED_WAITING
  staff_serve_sec: 3        # staff presence needed → SERVED
  leave_confirm_sec: 20     # zero guests for this long → NEEDS_CLEANING
  staff_clean_sec: 5        # staff presence at a dirty table → FREE
  debounce_window_sec: 3    # sliding window for majority vote
  majority_ratio: 0.5       # fraction of samples in window needed to count as "present"

alerts:
  waiter_alert_sec: 180     # SEATED_WAITING longer than this → alert
  realert_sec: 120          # repeat reminder interval
  escalate_sec: 300         # escalate to critical after this long waiting
  clean_alert_sec: 120      # NEEDS_CLEANING longer than this → alert

queue:
  fallback_cleaning_min: 3  # used for predictions until enough history exists

analytics:
  seed_demo_data: true
  seed_weeks: 4
  tables_per_waiter: 4
  avg_bill: 600
  fallback_session_min: 50

staff:
  method: combined          # uniform | posture | combined
  uniform_hsv: null          # set from the Setup page by clicking a waiter's shirt
                             # (format: {lower: [h,s,v], upper: [h,s,v]}, OpenCV HSV, h 0-179)
  uniform_min_ratio: 0.30    # >30% of upper-body pixels in range -> staff
  seated_guest_sec: 20       # seated & still in a zone this long -> confirmed guest
  posture:
    seated_max_aspect: 1.6   # box height/width at or below this = seated
    stationary_rel: 0.35     # moved less than this many body-heights over 3s = stationary

detector:
  model: "yolo11n.pt"       # downloaded automatically into models/ on first live run
  conf: 0.35
  imgsz: 640                # YOLO input size; 480 is faster on slow laptops
  process_every_n: 3        # run AI on every Nth camera frame
  threads: 0                # PyTorch CPU threads; 0 = auto (half the cores, max 4)
  max_width: 960            # frames are resized to this width before processing

live:
  zone_overlap_min: 0.3     # person box >=30% inside a table polygon counts as at the table
  staff_adjacent_px: 40     # staff within this many px of a table polygon count as visiting
  anchor_y: 1.0             # person position for zone checks: 1.0 = feet (bottom of box);
                            # use ~0.7 for steep ceiling cameras where boxes reach past the chair

privacy:
  face_blur: false

whatsapp:
  enabled: false            # credentials are read from .env (TWILIO_SID, TWILIO_TOKEN, TWILIO_FROM, TWILIO_TO)
